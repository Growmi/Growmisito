<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Feedback — GrowMi</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1E0C2C">
<link rel="apple-touch-icon" href="assets/img/staff-icon.png">
<link rel="icon" href="assets/img/staff-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --purple-deep:#3E0D5D; --purple-deeper:#2C0943; --coral:#F86639; --yellow:#FDC631;
    --cream:#FBF6F0; --ink:#1E0C2C;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--ink); color:var(--cream); font-family:'Inter', system-ui, sans-serif;
    display:flex; flex-direction:column; min-height:100vh; min-height:100dvh;
  }
  header{ padding:18px 20px; border-bottom:1px solid rgba(251,246,240,0.12); }
  header .top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
  header h1{ font-family:'Space Grotesk', sans-serif; font-size:18px; font-weight:700; }
  header a.back{ font-size:13px; color:rgba(251,246,240,0.6); text-decoration:underline; }
  header p{ font-size:12.5px; color:rgba(251,246,240,0.6); }

  main{ flex:1; padding:20px; max-width:640px; margin:0 auto; width:100%; }

  #count{ font-size:13px; color:rgba(251,246,240,0.55); margin-bottom:14px; }

  .card{
    padding:16px 18px; border-radius:14px; background:rgba(251,246,240,0.06); margin-bottom:12px;
  }
  .card .top-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px; }
  .card .name{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:15px; }
  .card .sub{ font-size:12px; color:rgba(251,246,240,0.55); margin-top:2px; }
  .card .stars{ color:var(--yellow); font-size:15px; white-space:nowrap; }
  .card .rec{
    display:inline-block; font-size:11px; font-weight:700; font-family:'Space Grotesk', sans-serif;
    padding:3px 9px; border-radius:20px; margin-top:6px;
  }
  .card .rec.yes{ background:rgba(46,204,113,0.18); color:#6EE7A8; }
  .card .rec.no{ background:rgba(224,33,122,0.18); color:#F792C0; }
  .card .field{ margin-top:10px; font-size:13.5px; line-height:1.5; }
  .card .field b{ display:block; font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; color:rgba(251,246,240,0.5); margin-bottom:3px; }
  .card .time{ font-size:11.5px; color:rgba(251,246,240,0.4); margin-top:10px; }

  #empty{ text-align:center; color:rgba(251,246,240,0.5); font-size:14px; padding:40px 0; }

  .key-gate{
    position:fixed; inset:0; background:var(--ink); display:flex; align-items:center;
    justify-content:center; padding:24px; z-index:10;
  }
  .key-gate.hidden{ display:none; }
  .key-card{ max-width:340px; width:100%; text-align:center; }
  .key-card h2{ font-family:'Space Grotesk', sans-serif; font-size:20px; margin-bottom:10px; }
  .key-card p{ font-size:13.5px; color:rgba(251,246,240,0.6); margin-bottom:18px; }
  .key-card input{
    width:100%; padding:14px 16px; border-radius:12px; border:1.5px solid rgba(251,246,240,0.25);
    background:rgba(251,246,240,0.06); color:var(--cream); font-size:15px; margin-bottom:12px;
  }
  .key-card button{
    width:100%; padding:14px; border-radius:12px; border:none; background:var(--coral); color:#fff;
    font-weight:700; font-family:'Space Grotesk', sans-serif; cursor:pointer; font-size:14px;
  }
  #exportCsvBtn{
    width:100%; padding:14px; border-radius:12px; border:1.5px solid rgba(251,246,240,0.25);
    background:rgba(251,246,240,0.06); color:var(--cream); font-family:'Space Grotesk', sans-serif;
    font-weight:700; font-size:14px; cursor:pointer; margin-bottom:16px;
  }
</style>
</head>
<body>

<div class="key-gate" id="keyGate">
  <div class="key-card">
    <h2>Risposte feedback</h2>
    <p>Inserisci la chiave staff per vederle.</p>
    <input type="password" id="keyInput" placeholder="Chiave staff" autocomplete="off">
    <button type="button" id="keySubmit">Entra</button>
  </div>
</div>

<header>
  <div class="top">
    <h1>Feedback ricevuti</h1>
    <a class="back" href="staff">Staff</a>
    <a class="back" href="staff-attendees" style="margin-left:10px;">&larr; Presenti</a>
  </div>
  <p>Tutte le risposte inviate dal form di feedback</p>
</header>

<main>
  <button type="button" id="exportCsvBtn">💾 Scarica tutte le risposte (Excel/CSV)</button>
  <p id="count"></p>
  <div id="list"></div>
  <p id="empty" style="display:none;">Nessuna risposta ricevuta finora.</p>
</main>

<script>
(function(){
  var KEY_STORAGE = "growmi_staff_key";
  var keyGate = document.getElementById("keyGate");
  var keyInput = document.getElementById("keyInput");
  var list = document.getElementById("list");
  var count = document.getElementById("count");
  var empty = document.getElementById("empty");

  function getStaffKey(){ return localStorage.getItem(KEY_STORAGE); }
  function setStaffKey(k){ localStorage.setItem(KEY_STORAGE, k); }
  function clearStaffKey(){ localStorage.removeItem(KEY_STORAGE); }

  function esc(s){
    var d = document.createElement("div");
    d.textContent = s || "";
    return d.innerHTML;
  }

  function stars(n){
    var s = "";
    for (var i = 1; i <= 5; i++) s += (i <= n ? "★" : "☆");
    return s;
  }

  function render(items){
    list.innerHTML = "";
    empty.style.display = items.length ? "none" : "block";
    count.textContent = items.length + (items.length === 1 ? " risposta" : " risposte");
    items.forEach(function(r){
      var card = document.createElement("div");
      card.className = "card";
      var time = r.submittedAt ? new Date(r.submittedAt).toLocaleString("it-IT") : "";
      var html =
        '<div class="top-row">' +
          '<div>' +
            '<div class="name">' + esc(r.name || "Anonimo") + '</div>' +
            '<div class="sub">' + [esc(r.email), esc(r.eventName)].filter(Boolean).join(" — ") + '</div>' +
          '</div>' +
          '<div class="stars">' + stars(r.rating) + '</div>' +
        '</div>' +
        '<span class="rec ' + (r.wouldRecommend ? "yes" : "no") + '">' + (r.wouldRecommend ? "Consiglierebbe GrowMi" : "Non ancora convinto/a") + '</span>';
      if (r.liked) html += '<div class="field"><b>Cosa è piaciuto</b>' + esc(r.liked) + '</div>';
      if (r.improve) html += '<div class="field"><b>Cosa migliorare</b>' + esc(r.improve) + '</div>';
      if (r.comments) html += '<div class="field"><b>Altro</b>' + esc(r.comments) + '</div>';
      html += '<div class="time">' + time + '</div>';
      card.innerHTML = html;
      list.appendChild(card);
    });
  }

  async function loadResponses(){
    try {
      var res = await fetch("/api/feedback-list", { headers: { "X-Staff-Key": getStaffKey() } });
      if (res.status === 401) {
        clearStaffKey();
        keyGate.classList.remove("hidden");
        return;
      }
      var data = await res.json();
      render(data.responses || []);
    } catch (e) {
      count.textContent = "Errore di connessione, riprova.";
    }
  }

  document.getElementById("exportCsvBtn").addEventListener("click", async function(){
    var btn = this;
    btn.disabled = true;
    btn.textContent = "Preparazione file...";
    try {
      var res = await fetch("/api/export-feedback", { headers: { "X-Staff-Key": getStaffKey() } });
      if (!res.ok) { alert("Errore nel generare il file."); return; }
      var blob = await res.blob();
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "growmi-feedback.csv";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (e) {
      alert("Errore di rete: " + e.message);
    }
    btn.disabled = false;
    btn.textContent = "💾 Scarica tutte le risposte (Excel/CSV)";
  });

  document.getElementById("keySubmit").addEventListener("click", function(){
    var k = keyInput.value.trim();
    if (!k) return;
    setStaffKey(k);
    keyGate.classList.add("hidden");
    loadResponses();
  });
  keyInput.addEventListener("keydown", function(e){
    if (e.key === "Enter") { document.getElementById("keySubmit").click(); }
  });

  if (getStaffKey()) {
    keyGate.classList.add("hidden");
    loadResponses();
  } else {
    keyInput.focus();
  }
})();
</script>

</body>
</html>
