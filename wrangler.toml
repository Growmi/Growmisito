name = "growmisito"
main = "src/worker.js"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./"
binding = "ASSETS"
# Senza questo, Cloudflare serve le pagine statiche direttamente senza passare dal Worker,
# quindi gli header di sicurezza aggiunti in withSecurityHeaders() non verrebbero applicati
# alla stragrande maggioranza delle richieste (tutte le pagine .html, css, js, immagini).
run_worker_first = true
# Pagina 404 personalizzata: qualsiasi richiesta a un file/percorso statico inesistente
# riceve 404.html invece della pagina di errore generica di Cloudflare.
not_found_handling = "404-page"

[[kv_namespaces]]
binding = "TICKETS"
id = "4b1c2c4b5d624f20ac9973b80a8a5430"

# Immagini eventi (hero, copertina, galleria) + immagine hero di default del sito, caricate
# dal pannello aziendale — vedi handleUploadImage/handleMedia in src/worker.js.
[[r2_buckets]]
binding = "EVENT_IMAGES"
bucket_name = "growmi-event-images"

# Rate limiting per IP sulle rotte sensibili (login/registrazione/checkout/coupon), per
# rallentare brute-force e abusi senza toccare la logica dei singoli handler.
[[ratelimits]]
name = "RL_AUTH"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 8
  period = 60

[[ratelimits]]
name = "RL_CHECKOUT"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "RL_COUPON"
namespace_id = "1003"
  [ratelimits.simple]
  limit = 5
  period = 60

# Base URL del sito, usata per costruire il link al form di feedback nativo (feedback.html)
# nelle email — da aggiornare qui quando Carlo collega un dominio vero, un solo posto da toccare.
[vars]
SITE_URL = "https://growmisito.grow-mi.workers.dev"

# Gira ogni giorno alle 10:00 UTC = mezzogiorno in Italia (ora legale, valida per l'evento del
# 10 settembre) - controlla se un evento è finito ieri e, se sì, manda il feedback in automatico.
[triggers]
crons = ["0 10 * * *"]
