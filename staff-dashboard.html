<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Dashboard — GrowMi</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1E0C2C">
<link rel="apple-touch-icon" href="assets/img/staff-icon.png">
<link rel="icon" href="assets/img/staff-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --purple-deep:#3E0D5D; --purple-deeper:#2C0943; --coral:#F86639; --yellow:#FDC631;
    --cream:#FBF6F0; --ink:#1E0C2C;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--ink); color:var(--cream); font-family:'Inter', system-ui, sans-serif;
    display:flex; flex-direction:column; min-height:100vh; min-height:100dvh;
  }
  header{ padding:18px 20px; border-bottom:1px solid rgba(251,246,240,0.12); }
  header .top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
  header h1{ font-family:'Space Grotesk', sans-serif; font-size:18px; font-weight:700; }
  header a.back{ font-size:13px; color:rgba(251,246,240,0.6); text-decoration:underline; }
  header p{ font-size:12.5px; color:rgba(251,246,240,0.6); }

  main{ flex:1; padding:20px; max-width:640px; margin:0 auto; width:100%; }

  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .stat{ background:rgba(251,246,240,0.06); border-radius:16px; padding:20px 18px; }
  .stat .n{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:28px; display:block; margin-bottom:4px; }
  .stat .l{ font-size:12.5px; color:rgba(251,246,240,0.55); }
  .stat.wide{ grid-column:1 / -1; }

  .gate-loading{
    position:fixed; inset:0; background:var(--ink); display:flex; align-items:center;
    justify-content:center; padding:24px; z-index:10; font-size:13.5px; color:rgba(251,246,240,0.5);
  }
  .gate-loading.hidden{ display:none; }
</style>
</head>
<body>

<div class="gate-loading" id="gateLoading">Verifica accesso…</div>

<header>
  <div class="top">
    <h1>Dashboard</h1>
    <a class="back" href="staff">Staff</a>
  </div>
  <p>I numeri chiave di GrowMi, a colpo d'occhio</p>
</header>

<main>
  <div class="grid">
    <div class="stat wide">
      <span class="n" id="statRevenue">—</span>
      <span class="l">Incasso totale biglietti</span>
    </div>
    <div class="stat">
      <span class="n" id="statSold">—</span>
      <span class="l">Biglietti venduti</span>
    </div>
    <div class="stat">
      <span class="n" id="statCheckedIn">—</span>
      <span class="l">Entrati</span>
    </div>
    <div class="stat">
      <span class="n" id="statAccounts">—</span>
      <span class="l">Account registrati</span>
    </div>
    <div class="stat">
      <span class="n" id="statNewsletter">—</span>
      <span class="l">Iscritti newsletter</span>
    </div>
    <div class="stat">
      <span class="n" id="statFeedbackCount">—</span>
      <span class="l">Feedback ricevuti</span>
    </div>
    <div class="stat">
      <span class="n" id="statAvgRating">—</span>
      <span class="l">Valutazione media</span>
    </div>
  </div>
</main>

<script>
(function(){
  var gateLoading = document.getElementById("gateLoading");

  function goToLogin(){
    location.href = "azienda?next=" + encodeURIComponent(location.pathname.replace(/^\//, ""));
  }

  function euro(cents){
    return "€" + (cents / 100).toLocaleString("it-IT", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  }

  async function load(){
    try {
      var res = await fetch("/api/dashboard-stats");
      if (res.status === 401) { goToLogin(); return; }
      if (!res.ok) return;
      var d = await res.json();
      document.getElementById("statRevenue").textContent = euro(d.revenueCents);
      document.getElementById("statSold").textContent = d.ticketsSold;
      document.getElementById("statCheckedIn").textContent = d.ticketsCheckedIn;
      document.getElementById("statAccounts").textContent = d.accountsTotal;
      document.getElementById("statNewsletter").textContent = d.newsletterSubscribers;
      document.getElementById("statFeedbackCount").textContent = d.feedbackCount;
      document.getElementById("statAvgRating").textContent = d.avgRating !== null ? (d.avgRating + " / 5") : "—";
    } catch (e) { /* connessione assente: lascia i numeri come sono */ }
  }

  load().then(function(){ gateLoading.classList.add("hidden"); });
})();
</script>

</body>
</html>
