<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento confermato — GrowMi</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2C0943">
<link rel="icon" href="assets/img/logo-growmi.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --purple-deep:#3E0D5D; --purple-deeper:#2C0943; --coral:#F86639; --yellow:#FDC631; --cream:#FBF6F0; --ink:#1E0C2C; --grey:#6E6478; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--cream); color:var(--ink); font-family:'Inter', system-ui, sans-serif;
    line-height:1.6; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:40px 20px; text-align:center;
  }
  h1{ font-family:'Space Grotesk', sans-serif; font-weight:700; }
  .logo{ height:32px; margin-bottom:28px; }
  .card{ width:100%; max-width:480px; background:#fff; border-radius:24px; padding:44px 32px; box-shadow:0 20px 50px rgba(30,12,44,0.1); }
  .big{ font-size:44px; margin-bottom:14px; }
  h1{ font-size:24px; margin-bottom:10px; }
  p{ font-size:14.5px; color:var(--grey); }
  a.btn{
    display:inline-block; margin-top:14px; padding:14px 28px; border-radius:12px; background:var(--coral);
    color:#fff; text-decoration:none; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px;
  }
  a.btn.outline{ background:none; border:1.5px solid var(--ink); color:var(--ink); }
  .btn-row{ display:flex; flex-direction:column; gap:12px; }
</style>
</head>
<body>

<img class="logo" src="assets/img/logo-growmi.png" alt="GrowMi">
<div class="card">
  <div class="big">🎉</div>
  <h1>Pagamento andato a buon fine!</h1>
  <p>Il biglietto con il QR di ingresso sta arrivando alla tua email da un momento all'altro. Controlla anche nello spam.</p>
  <p style="margin-top:18px;">Vuoi salvare i tuoi biglietti in un unico posto e iniziare a timbrare la tua loyalty card?</p>
  <div class="btn-row">
    <a class="btn" href="area-personale.html">Crea la tua area personale</a>
    <a class="btn outline" href="eventi.html">Torna agli eventi</a>
  </div>
</div>

</body>
</html>
