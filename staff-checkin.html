<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Staff — GrowMi</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1E0C2C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GrowMi Check-in">
<link rel="manifest" href="staff-manifest.json">
<link rel="apple-touch-icon" href="assets/img/staff-icon.png">
<link rel="icon" href="assets/img/staff-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --purple-deep:#3E0D5D;
    --purple-deeper:#2C0943;
    --coral:#F86639;
    --yellow:#FDC631;
    --cream:#FBF6F0;
    --ink:#1E0C2C;
    --green:#2ECC71;
    --red:#E0217A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--ink); color:var(--cream);
    font-family:'Inter', system-ui, sans-serif;
    display:flex; flex-direction:column; min-height:100vh; min-height:100dvh;
  }
  header{
    padding:18px 20px; text-align:center; border-bottom:1px solid rgba(251,246,240,0.12);
  }
  header h1{
    font-family:'Space Grotesk', sans-serif; font-size:18px; font-weight:700;
  }
  header p{ font-size:12.5px; color:rgba(251,246,240,0.6); margin-top:2px; }

  .mode-tabs{ display:flex; gap:8px; padding:14px 20px 0; max-width:480px; margin:0 auto; width:100%; }
  .mode-tabs button{
    flex:1; padding:11px; border-radius:12px; border:1.5px solid rgba(251,246,240,0.2);
    background:none; color:rgba(251,246,240,0.7); font-family:'Space Grotesk', sans-serif;
    font-weight:700; font-size:13.5px; cursor:pointer;
  }
  .mode-tabs button.is-active{ background:var(--coral); border-color:var(--coral); color:#fff; }

  main{ flex:1; display:flex; flex-direction:column; padding:20px; gap:18px; max-width:480px; margin:0 auto; width:100%; }

  #reader{ width:100%; border-radius:16px; overflow:hidden; background:#000; }
  #reader video{ border-radius:16px; }

  .manual-row{ display:flex; gap:10px; }
  .manual-row input{
    flex:1; padding:14px 16px; border-radius:12px; border:1.5px solid rgba(251,246,240,0.25);
    background:rgba(251,246,240,0.06); color:var(--cream); font-size:16px;
    font-family:'Space Grotesk', sans-serif; letter-spacing:0.05em; text-transform:uppercase;
  }
  .manual-row input::placeholder{ color:rgba(251,246,240,0.4); text-transform:none; letter-spacing:normal; }
  .manual-row button{
    padding:14px 20px; border-radius:12px; border:none; background:var(--coral); color:#fff;
    font-weight:700; font-family:'Space Grotesk', sans-serif; cursor:pointer; font-size:14px;
  }

  #result{
    border-radius:16px; padding:22px; text-align:center; display:none;
  }
  #result.valid{ background:rgba(46,204,113,0.15); border:2px solid var(--green); display:block; }
  #result.invalid{ background:rgba(224,33,122,0.15); border:2px solid var(--red); display:block; }
  #result .icon{ font-size:40px; margin-bottom:8px; }
  #result .title{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:20px; margin-bottom:6px; }
  #result .detail{ font-size:14px; color:rgba(251,246,240,0.75); margin-bottom:14px; }
  #result .rewards{ display:flex; flex-direction:column; gap:8px; }
  #result .reward{
    display:flex; justify-content:space-between; align-items:center; padding:10px 14px;
    border-radius:10px; background:rgba(251,246,240,0.08); font-size:13.5px;
  }
  #result .reward.unlocked{ background:rgba(46,204,113,0.18); }

  .stats{ text-align:center; font-size:12.5px; color:rgba(251,246,240,0.5); }

  .stats-bar{
    display:flex; gap:10px; padding:14px 20px; border-bottom:1px solid rgba(251,246,240,0.12);
  }
  .stats-bar[hidden]{ display:none; }
  .stats-box{
    flex:1; text-align:center; background:rgba(251,246,240,0.06); border-radius:12px; padding:10px 8px;
  }
  .stats-box .n{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:22px; display:block; }
  .stats-box .l{ font-size:11px; color:rgba(251,246,240,0.55); text-transform:uppercase; letter-spacing:0.04em; }

  .key-gate{
    position:fixed; inset:0; background:var(--ink); display:flex; align-items:center;
    justify-content:center; padding:24px; z-index:10;
  }
  .key-gate.hidden{ display:none; }
  .key-card{ max-width:340px; width:100%; text-align:center; }
  .key-card h2{ font-family:'Space Grotesk', sans-serif; font-size:20px; margin-bottom:10px; }
  .key-card p{ font-size:13.5px; color:rgba(251,246,240,0.6); margin-bottom:18px; }
  .key-card input{
    width:100%; padding:14px 16px; border-radius:12px; border:1.5px solid rgba(251,246,240,0.25);
    background:rgba(251,246,240,0.06); color:var(--cream); font-size:15px; margin-bottom:12px;
  }
  .key-card button{
    width:100%; padding:14px; border-radius:12px; border:none; background:var(--coral); color:#fff;
    font-weight:700; font-family:'Space Grotesk', sans-serif; cursor:pointer; font-size:14px;
  }
  .change-key{
    text-align:center; font-size:12px; color:rgba(251,246,240,0.4); text-decoration:underline;
    background:none; border:none; cursor:pointer; padding:8px;
  }
</style>
</head>
<body>

<div class="key-gate" id="keyGate">
  <div class="key-card">
    <h2>Staff GrowMi</h2>
    <p>Inserisci la chiave staff per accedere allo scanner.</p>
    <input type="password" id="keyInput" placeholder="Chiave staff" autocomplete="off">
    <button type="button" id="keySubmit">Entra</button>
  </div>
</div>

<header>
  <h1 id="pageTitle">Check-in biglietti</h1>
  <p id="pageSub">Scanner GrowMi — valido per qualsiasi evento</p>
</header>

<div class="mode-tabs">
  <button type="button" class="is-active" id="tabCheckin" data-mode="checkin">Biglietti</button>
  <button type="button" id="tabLoyalty" data-mode="loyalty">Loyalty</button>
</div>

<div class="stats-bar" id="statsBar">
  <a class="stats-box" href="staff-attendees" style="text-decoration:none; color:inherit;"><span class="n" id="statTotal">—</span><span class="l">Venduti</span></a>
  <a class="stats-box" href="staff-attendees" style="text-decoration:none; color:inherit;"><span class="n" id="statCheckedIn">—</span><span class="l">Entrati &rarr; elenco</span></a>
</div>

<main>
  <div id="reader"></div>

  <div class="manual-row">
    <input type="text" id="manualCode" placeholder="Codice biglietto" autocomplete="off">
    <button type="button" id="manualSubmit">Controlla</button>
  </div>

  <div id="result"></div>
</main>

<button type="button" class="change-key" id="changeKey">Cambia chiave staff</button>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
(function(){
  var KEY_STORAGE = "growmi_staff_key";
  var scanner = null;
  var busy = false;
  // "checkin" (biglietti, QR) o "loyalty" (numero cliente, barcode) — un solo scanner fotocamera
  // condiviso tra le due modalità, cambia solo dove viene mandato il testo decodificato, così
  // non serve riavviare la fotocamera passando da una scheda all'altra.
  var mode = "checkin";

  var keyGate = document.getElementById("keyGate");
  var keyInput = document.getElementById("keyInput");
  var result = document.getElementById("result");
  var statTotal = document.getElementById("statTotal");
  var statCheckedIn = document.getElementById("statCheckedIn");
  var statsBar = document.getElementById("statsBar");
  var manualCode = document.getElementById("manualCode");
  var pageTitle = document.getElementById("pageTitle");
  var pageSub = document.getElementById("pageSub");

  function getStaffKey(){ return localStorage.getItem(KEY_STORAGE); }
  function setStaffKey(k){ localStorage.setItem(KEY_STORAGE, k); }
  function clearStaffKey(){ localStorage.removeItem(KEY_STORAGE); }

  function setMode(m){
    mode = m;
    document.getElementById("tabCheckin").classList.toggle("is-active", m === "checkin");
    document.getElementById("tabLoyalty").classList.toggle("is-active", m === "loyalty");
    statsBar.hidden = m !== "checkin";
    manualCode.placeholder = m === "checkin" ? "Codice biglietto" : "Numero cliente";
    pageTitle.textContent = m === "checkin" ? "Check-in biglietti" : "Ricerca loyalty";
    pageSub.textContent = m === "checkin" ? "Scanner GrowMi — valido per qualsiasi evento" : "Cerca un cliente dal barcode della loyalty card";
    result.className = "";
    result.innerHTML = "";
    manualCode.value = "";
  }
  document.getElementById("tabCheckin").addEventListener("click", function(){ setMode("checkin"); });
  document.getElementById("tabLoyalty").addEventListener("click", function(){ setMode("loyalty"); });

  // Numeri veri (venduti/entrati), letti dal server ad ogni apertura e dopo ogni scansione
  // riuscita — non un conteggio locale che si azzera cambiando dispositivo o ricaricando.
  async function refreshStats(){
    try {
      var res = await fetch("/api/stats", { headers: { "X-Staff-Key": getStaffKey() } });
      if (!res.ok) return;
      var data = await res.json();
      statTotal.textContent = data.total;
      statCheckedIn.textContent = data.checkedIn;
    } catch (e) { /* connessione assente: lascia i numeri come sono */ }
  }

  // Suono generato al volo (nessun file audio da caricare): un bip alto e breve per un esito
  // positivo, due bip più bassi per un rifiuto — riconoscibili anche senza guardare lo schermo,
  // utile in un ingresso buio/rumoroso.
  var audioCtx = null;
  function beep(frequencies, duration){
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var t = audioCtx.currentTime;
      frequencies.forEach(function(freq, i){
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.2, t + i * (duration + 0.06));
        gain.gain.exponentialRampToValueAtTime(0.001, t + i * (duration + 0.06) + duration);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t + i * (duration + 0.06));
        osc.stop(t + i * (duration + 0.06) + duration);
      });
    } catch (e) { /* audio non disponibile, non blocca la scansione */ }
  }

  function showResult(ok, title, detail, extraHtml){
    result.className = ok ? "valid" : "invalid";
    result.innerHTML =
      '<div class="icon">' + (ok ? "✅" : "❌") + '</div>' +
      '<div class="title">' + title + '</div>' +
      '<div class="detail">' + (detail || "") + '</div>' +
      (extraHtml || '');
    if (navigator.vibrate) navigator.vibrate(ok ? 80 : [60, 60, 60]);
    beep(ok ? [880] : [330, 330], ok ? 0.15 : 0.12);
  }

  async function checkTicket(code){
    try {
      var res = await fetch("/api/checkin", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Staff-Key": getStaffKey() },
        body: JSON.stringify({ code: code })
      });
      if (res.status === 401) { onUnauthorized(); return; }
      var data = await res.json();
      if (data.valid) {
        refreshStats();
        showResult(true, data.eventName || "Ingresso valido", [data.name, data.email, data.tierName].filter(Boolean).join(" — "));
      } else if (data.reason === "already_used") {
        showResult(false, "Già usato", data.usedAt ? ("Usato il " + new Date(data.usedAt).toLocaleString("it-IT")) : "");
      } else {
        showResult(false, "Biglietto non trovato", "Controlla il codice");
      }
    } catch (e) {
      showResult(false, "Errore di rete", "Riprova");
    }
  }

  async function lookupLoyalty(number){
    try {
      var res = await fetch("/api/lookup-customer?number=" + encodeURIComponent(number), {
        headers: { "X-Staff-Key": getStaffKey() }
      });
      if (res.status === 401) { onUnauthorized(); return; }
      var data = await res.json();
      if (data.found) {
        var rewards =
          '<div class="rewards">' +
          '<div class="reward' + (data.reward3 ? ' unlocked' : '') + '"><span>3° evento — drink offerto</span><span>' + (data.reward3 ? '✓' : '🔒') + '</span></div>' +
          '<div class="reward' + (data.reward5 ? ' unlocked' : '') + '"><span>5° evento — ingresso gratuito</span><span>' + (data.reward5 ? '✓' : '🔒') + '</span></div>' +
          '</div>';
        showResult(true, data.name || "Cliente trovato", data.stamps + (data.stamps === 1 ? ' timbro' : ' timbri'), rewards);
      } else {
        showResult(false, "Nessun account trovato", "Controlla il numero");
      }
    } catch (e) {
      showResult(false, "Errore di rete", "Riprova");
    }
  }

  function onUnauthorized(){
    clearStaffKey();
    keyGate.classList.remove("hidden");
  }

  async function handleScan(text){
    if (busy || !text) return;
    busy = true;
    if (mode === "checkin") await checkTicket(text);
    else await lookupLoyalty(text);
    setTimeout(function(){ busy = false; }, 1200);
  }

  document.getElementById("manualSubmit").addEventListener("click", function(){
    var code = manualCode.value;
    handleScan(code);
    manualCode.value = "";
  });
  manualCode.addEventListener("keydown", function(e){
    if (e.key === "Enter") { document.getElementById("manualSubmit").click(); }
  });

  document.getElementById("keySubmit").addEventListener("click", function(){
    var k = keyInput.value.trim();
    if (!k) return;
    setStaffKey(k);
    keyGate.classList.add("hidden");
    startScanner();
    refreshStats();
  });
  keyInput.addEventListener("keydown", function(e){
    if (e.key === "Enter") { document.getElementById("keySubmit").click(); }
  });

  document.getElementById("changeKey").addEventListener("click", function(){
    clearStaffKey();
    keyGate.classList.remove("hidden");
    keyInput.value = "";
    keyInput.focus();
  });

  function startScanner(){
    if (scanner) return;
    scanner = new Html5Qrcode("reader");
    scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 240, height: 240 } },
      function(decodedText){ handleScan(decodedText); },
      function(){ /* scan errors per frame, ignorati */ }
    ).catch(function(err){
      document.getElementById("reader").innerHTML =
        '<p style="padding:24px; text-align:center; color:rgba(251,246,240,0.6); font-size:13.5px;">Fotocamera non disponibile (' + err + '). Usa l\'inserimento manuale qui sotto.</p>';
    });
  }

  if (getStaffKey()) {
    keyGate.classList.add("hidden");
    startScanner();
    refreshStats();
  } else {
    keyInput.focus();
  }
  setInterval(function(){ if (getStaffKey() && mode === "checkin") refreshStats(); }, 30000);
})();
</script>

</body>
</html>
