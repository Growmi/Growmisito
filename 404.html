<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagina non trovata — GrowMi</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --purple-deep:#3E0D5D;
  --purple-deeper:#2C0943;
  --coral:#F86639;
  --cream:#FBF6F0;
  --ink:#1E0C2C;
  --grey:#6E6478;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--purple-deeper);
  color:var(--cream);
  font-family:'Inter', system-ui, sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  text-align:center;
}
.wrap{max-width:520px;}
.logo{height:34px; margin-bottom:48px;}
.code{
  font-family:'Space Grotesk', sans-serif;
  font-weight:700;
  font-size:clamp(64px, 18vw, 120px);
  line-height:1;
  color:var(--coral);
  margin-bottom:8px;
}
h1{
  font-family:'Space Grotesk', sans-serif;
  font-weight:700;
  font-size:clamp(20px, 4vw, 28px);
  margin-bottom:14px;
}
p{
  color:rgba(251,246,240,0.75);
  font-size:15px;
  line-height:1.6;
  margin-bottom:36px;
}
.btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-family:'Space Grotesk', sans-serif;
  font-weight:700;
  font-size:14px;
  padding:14px 26px;
  border-radius:999px;
  border:2px solid var(--cream);
  background:var(--cream);
  color:var(--ink);
  text-decoration:none;
  transition:transform .15s ease, opacity .15s ease;
}
.btn:hover{transform:translateY(-2px);}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="assets/img/logo-growmi.png" alt="GrowMi">
  <div class="code">404</div>
  <h1>Questa pagina non esiste</h1>
  <p>Il link potrebbe essere sbagliato o la pagina è stata spostata. Torna alla home per continuare a esplorare GrowMi.</p>
  <a class="btn" href="/">Torna alla home</a>
</div>
</body>
</html>
