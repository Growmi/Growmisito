<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Presenti — GrowMi</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1E0C2C">
<link rel="apple-touch-icon" href="assets/img/staff-icon.png">
<link rel="icon" href="assets/img/staff-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --purple-deep:#3E0D5D; --purple-deeper:#2C0943; --coral:#F86639; --yellow:#FDC631;
    --cream:#FBF6F0; --ink:#1E0C2C;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--ink); color:var(--cream); font-family:'Inter', system-ui, sans-serif;
    display:flex; flex-direction:column; min-height:100vh; min-height:100dvh;
  }
  header{ padding:18px 20px; border-bottom:1px solid rgba(251,246,240,0.12); }
  header .top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
  header h1{ font-family:'Space Grotesk', sans-serif; font-size:18px; font-weight:700; }
  header a.back{ font-size:13px; color:rgba(251,246,240,0.6); text-decoration:underline; }
  header p{ font-size:12.5px; color:rgba(251,246,240,0.6); }

  main{ flex:1; padding:20px; max-width:560px; margin:0 auto; width:100%; }

  #search{
    width:100%; padding:14px 16px; border-radius:12px; border:1.5px solid rgba(251,246,240,0.25);
    background:rgba(251,246,240,0.06); color:var(--cream); font-size:16px; margin-bottom:16px;
  }
  #search::placeholder{ color:rgba(251,246,240,0.4); }

  #count{ font-size:13px; color:rgba(251,246,240,0.55); margin-bottom:14px; }

  .row{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:14px 16px; border-radius:12px; background:rgba(251,246,240,0.06); margin-bottom:8px;
  }
  .row .info .name{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:15px; }
  .row .info .sub{ font-size:12.5px; color:rgba(251,246,240,0.6); margin-top:2px; }
  .row .time{ font-size:12px; color:rgba(251,246,240,0.5); white-space:nowrap; text-align:right; }
  .row .badge{
    display:inline-block; margin-top:4px; padding:2px 9px; border-radius:20px; font-size:10.5px;
    font-family:'Space Grotesk', sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.03em;
  }
  .row .badge.card{ background:rgba(253,198,49,0.2); color:var(--yellow); }
  .row .badge.account{ background:rgba(46,204,113,0.18); color:#5FE0A0; }
  .row .badge.guest{ background:rgba(251,246,240,0.08); color:rgba(251,246,240,0.5); }

  #empty{ text-align:center; color:rgba(251,246,240,0.5); font-size:14px; padding:40px 0; }

  .gate-loading{
    position:fixed; inset:0; background:var(--ink); display:flex; align-items:center;
    justify-content:center; padding:24px; z-index:10; font-size:13.5px; color:rgba(251,246,240,0.5);
  }
  .gate-loading.hidden{ display:none; }
</style>
</head>
<body>

<div class="gate-loading" id="gateLoading">Verifica accesso…</div>

<header>
  <div class="top">
    <h1>Chi è entrato</h1>
    <span>
      <a class="back" href="staff">Staff</a>
      <a class="back" href="staff-feedback" style="margin-left:10px;">Feedback &rarr;</a>
      <a class="back" href="staff-checkin" style="margin-left:10px;">&larr; Scanner</a>
    </span>
  </div>
  <p>Elenco di chi ha fatto check-in, con ricerca</p>
</header>

<main>
  <button type="button" id="exportCsvBtn" style="width:100%; padding:14px; border-radius:12px; border:1.5px solid rgba(251,246,240,0.25); background:rgba(251,246,240,0.06); color:var(--cream); font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:14px; cursor:pointer; margin-bottom:10px;">&#128190; Scarica elenco completo (Excel/CSV)</button>
  <button type="button" id="sendFeedbackBtn" style="width:100%; padding:14px; border-radius:12px; border:1.5px solid rgba(251,246,240,0.25); background:rgba(251,246,240,0.06); color:var(--cream); font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:14px; cursor:pointer; margin-bottom:16px;">&#128231; Manda email di feedback a tutti i presenti</button>
  <input type="text" id="search" placeholder="Cerca per nome...">
  <p id="count"></p>
  <div id="list"></div>
  <p id="empty" style="display:none;">Nessun nominativo trovato.</p>
</main>

<script>
(function(){
  var gateLoading = document.getElementById("gateLoading");
  var list = document.getElementById("list");
  var count = document.getElementById("count");
  var empty = document.getElementById("empty");
  var search = document.getElementById("search");
  var allAttendees = [];

  function goToLogin(){
    location.href = "azienda?next=" + encodeURIComponent(location.pathname.replace(/^\//, ""));
  }

  function render(items){
    list.innerHTML = "";
    empty.style.display = items.length ? "none" : "block";
    count.textContent = items.length + (items.length === 1 ? " persona entrata" : " persone entrate");
    items.forEach(function(a){
      var row = document.createElement("div");
      row.className = "row";
      var time = a.usedAt ? new Date(a.usedAt).toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" }) : "";
      // Differenzia chi ha una loyalty card (registrato, con o senza carta fisica riscattata)
      // da chi ha comprato solo "come ospite" senza mai crearsi un account — vedi
      // handleAttendees in src/worker.js.
      var badge = a.physicalCardClaimed
        ? '<span class="badge card">🪪 Carta fisica</span>'
        : (a.hasLoyaltyAccount ? '<span class="badge account">⭐ Loyalty</span>' : '<span class="badge guest">Ospite</span>');
      row.innerHTML =
        '<div class="info">' +
          '<div class="name">' + (a.name || "Senza nome") + '</div>' +
          '<div class="sub">' + [a.email, a.tierName].filter(Boolean).join(" — ") + '</div>' +
        '</div>' +
        '<div class="time">' + time + '<br>' + badge + '</div>';
      list.appendChild(row);
    });
  }

  function applyFilter(){
    var q = search.value.trim().toLowerCase();
    if (!q) { render(allAttendees); return; }
    render(allAttendees.filter(function(a){
      return (a.name || "").toLowerCase().indexOf(q) !== -1;
    }));
  }

  async function loadAttendees(){
    try {
      var res = await fetch("/api/attendees");
      if (res.status === 401) { goToLogin(); return; }
      var data = await res.json();
      allAttendees = data.attendees || [];
      applyFilter();
    } catch (e) {
      count.textContent = "Errore di connessione, riprova.";
    }
  }

  search.addEventListener("input", applyFilter);

  document.getElementById("exportCsvBtn").addEventListener("click", async function(){
    var btn = this;
    btn.disabled = true;
    btn.textContent = "Preparazione file...";
    try {
      var res = await fetch("/api/export-attendees");
      if (res.status === 401) { goToLogin(); return; }
      if (!res.ok) { alert("Errore nel generare il file."); return; }
      var blob = await res.blob();
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "growmi-partecipanti.csv";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (e) {
      alert("Errore di rete: " + e.message);
    }
    btn.disabled = false;
    btn.textContent = "💾 Scarica elenco completo (Excel/CSV)";
  });

  document.getElementById("sendFeedbackBtn").addEventListener("click", async function(){
    if (!allAttendees.length) { alert("Nessun presente a cui mandare il feedback."); return; }
    if (!confirm("Mandare l'email di feedback (con il link al form del sito) a " + allAttendees.length + " persone entrate? Non si può annullare.")) return;
    var btn = this;
    btn.disabled = true;
    btn.textContent = "Invio in corso...";
    try {
      var res = await fetch("/api/send-feedback", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({})
      });
      if (res.status === 401) { goToLogin(); return; }
      var data = await res.json();
      if (res.ok) {
        alert("Fatto: " + data.sent + " email mandate su " + data.totalAttendees + " (" + data.failed + " fallite).");
      } else {
        alert("Errore: " + (data.error || res.status));
      }
    } catch (e) {
      alert("Errore di rete: " + e.message);
    }
    btn.disabled = false;
    btn.textContent = "📧 Manda email di feedback a tutti i presenti";
  });

  loadAttendees().then(function(){ gateLoading.classList.add("hidden"); });

  setInterval(loadAttendees, 30000);
})();
</script>

</body>
</html>
